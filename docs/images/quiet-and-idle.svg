<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
  <title id="title">Quiet output compared with an idle session</title>
  <desc id="desc">A filled yellow dot with “no output for 3m” still means a task is running. When no work remains, the waiting row is replaced by a hollow circle and “Stopped — nothing running”.</desc>
  <rect x="1" y="1" width="758" height="188" rx="8" fill="#152222" stroke="#46615b" stroke-width="2"/>
  <path d="M24 102h712" stroke="#425753"/>
  <g font-family="Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold">
    <text x="26" y="29" fill="#f6d58b">Still running</text>
    <text x="26" y="132" fill="#cedbd4">No work left</text>
  </g>
  <circle cx="33" cy="53" r="6.5" fill="#f1c767"/>
  <circle cx="33" cy="157" r="6.5" stroke="#b4c3bc" stroke-width="1.8" fill="none"/>
  <g font-family="Liberation Mono, Courier New, monospace">
    <text x="52" y="60" fill="#f1f6f3" font-size="21" xml:space="preserve"><tspan font-weight="bold">Waiting 3:10</tspan><tspan> · CI run watch 1234</tspan></text>
    <text x="52" y="85" fill="#bbcbc3" font-size="17" xml:space="preserve">CI run watch 1234 3:18<tspan fill="#f1c767"> · no output for 3m</tspan></text>
    <text x="52" y="164" fill="#bbcbc3" font-size="21">Stopped — nothing running</text>
  </g>
</svg>
